name: ci

on:
  push:
    branches: [FreeBuff, Grok]
  pull_request:
    branches: [FreeBuff, Grok]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install daemon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e daemon pytest pytest-asyncio
      - name: Unit and network tests
        run: python -m pytest daemon/tests -q
      - name: Diagnostics smoke test
        run: |
          python -m continuityd.cli --help >/dev/null 2>&1 || continuityd --help

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests (JVM)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Rename and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/continuity-android-debug.apk
          cd dist && sha256sum continuity-android-debug.apk > continuity-android-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/continuity-android-debug.apk*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd desktop-file-utils
      - name: Build Linux deliverables (canonical pipeline; AppImage failure is fatal)
        run: bash scripts/package-linux.sh
      - name: Verify artifacts
        run: |
          test -s dist/continuity-linux-x86_64.AppImage
          test -s dist/continuity-linux-x86_64.pkg.tar.zst
          test -s dist/continuity-linux-x86_64-portable.tar.zst
          cd dist && sha256sum -c SHA256SUMS
      - name: Validate the AppImage (type, exec bit, in-image self-test)
        run: |
          file dist/continuity-linux-x86_64.AppImage | grep -qi appimage
          chmod +x dist/continuity-linux-x86_64.AppImage
          QT_QPA_PLATFORM=offscreen dist/continuity-linux-x86_64.AppImage --self-test
          # FUSE-free invocation must also work
          QT_QPA_PLATFORM=offscreen dist/continuity-linux-x86_64.AppImage --appimage-extract-and-run --self-test
          # A path containing spaces must still launch the same entry point.
          # This is Ubuntu CI, not an Arch session — see the hardware ledger.
          mkdir -p "/tmp/Continuity Path"
          cp dist/continuity-linux-x86_64.AppImage "/tmp/Continuity Path/Continuity.AppImage"
          chmod +x "/tmp/Continuity Path/Continuity.AppImage"
          QT_QPA_PLATFORM=offscreen "/tmp/Continuity Path/Continuity.AppImage" --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deliverables
          path: |
            dist/continuity-linux-x86_64.AppImage
            dist/continuity-linux-x86_64.pkg.tar.zst
            dist/continuity-linux-x86_64-portable.tar.zst
            dist/SHA256SUMS
            dist/BUILD-MANIFEST.json

  arch-makepkg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: makepkg, install and verify in a clean Arch container
        run: |
          mkdir -p dist/makepkg
          docker run --rm -v "$PWD:/src" archlinux:latest bash -s <<'EOS'
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git sudo python python-cryptography python-zeroconf \
            python-qrcode python-dbus-next qt6-declarative
          useradd -m builder
          rm -rf /tmp/pkg
          mkdir -p /tmp/pkg /src/dist/makepkg
          cp /src/packaging/PKGBUILD /tmp/pkg/PKGBUILD
          chown -R builder:builder /tmp/pkg
          runuser -u builder -- bash -lc 'cd /tmp/pkg && makepkg -sfC --noconfirm --nocheck'
          mapfile -t built < <(find /tmp/pkg -maxdepth 1 -type f -name 'continuity-*.pkg.tar.zst' ! -name '*-debug-*' | sort)
          test "${#built[@]}" -eq 1
          case "${built[0]}" in
            *continuity-linux-x86_64.pkg.tar.zst)
              echo "refusing the manually assembled archive name" >&2
              exit 1
              ;;
          esac
          pacman -U --noconfirm "${built[0]}"
          bash /src/scripts/verify-arch-install.sh
          cp -v "${built[0]}" /src/dist/makepkg/
          EOS
      - uses: actions/upload-artifact@v4
        with:
          name: arch-makepkg-package
          path: dist/makepkg/*.pkg.tar.zst

